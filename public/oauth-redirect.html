<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그인 중...</title>
  <style>
    body { font-family: -apple-system, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #f5f5f5; }
    .card { background: white; border-radius: 16px; padding: 32px 24px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.1); max-width: 300px; width: 90%; }
    h2 { margin: 0 0 8px; font-size: 18px; color: #1a1a1a; }
    p { margin: 0 0 20px; font-size: 14px; color: #666; }
    .btn { background: #4A90D9; color: white; border: none; border-radius: 10px; padding: 14px 28px; font-size: 16px; cursor: pointer; width: 100%; }
    .btn:active { background: #357abd; }
    .error { color: #E05555; font-size: 13px; margin-top: 12px; }
    #status { font-size: 12px; color: #999; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>로그인 완료</h2>
    <p>앱으로 돌아가는 중...</p>
    <button class="btn" id="openBtn">Datile 앱 열기</button>
    <div class="error" id="errMsg"></div>
    <div id="status"></div>
  </div>
  <script>
    var hash = window.location.hash.substring(1);
    var params = new URLSearchParams(hash);
    var accessToken = params.get('access_token');
    var error = params.get('error');
    var isAndroid = /Android/i.test(navigator.userAgent);

    document.getElementById('status').textContent = 'Android: ' + isAndroid + ' | token: ' + (accessToken ? 'yes' : 'no');

    function buildUrl(token, err) {
      var query = token
        ? 'access_token=' + encodeURIComponent(token)
        : 'error=' + encodeURIComponent(err || 'unknown');
      if (isAndroid) {
        // Android: intent:// 방식으로 앱 직접 실행 (패키지 명시)
        return 'intent://oauth?' + query + '#Intent;scheme=datile;package=com.younghwa87.datile;end';
      }
      return 'datile://oauth?' + query;
    }

    if (!accessToken && !error) {
      document.getElementById('errMsg').textContent = '토큰이 없습니다. 다시 시도해주세요.';
    }

    var deepUrl = buildUrl(accessToken, error);

    document.getElementById('openBtn').onclick = function() {
      window.location.href = deepUrl;
    };

    // 자동 리다이렉트 시도
    if (accessToken || error) {
      window.location.href = deepUrl;
    }
  </script>
</body>
</html>
